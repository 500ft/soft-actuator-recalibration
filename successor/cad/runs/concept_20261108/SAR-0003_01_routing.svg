<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360"><rect width="1200" height="360" fill="#f5f7fa" /><text font-family="Arial" font-size="25" x="30" y="35" fill="#223344">SAR-0003 — single-channel functional routing</text><text font-family="Arial" font-size="16" x="30" y="63" fill="#8b2839">CONCEPT / HOLD — symbolic diagram; component ports and actual tubing routes are not released</text><rect stroke-dasharray="6 4" x="30" y="110" width="200" height="80" rx="8" fill="white" stroke="#5b7088" /><text font-family="Arial" font-size="16" x="42" y="141" fill="#223344">Regulated supply</text><text font-family="Arial" font-size="13" x="42" y="168" fill="#223344">Part pending</text><path stroke-width="2" d="M 230 150 L 255 150 l -6 -4 m 6 4 l -6 4" fill="none" stroke="#223344" /><rect stroke-dasharray="6 4" x="260" y="110" width="200" height="80" rx="8" fill="white" stroke="#5b7088" /><text font-family="Arial" font-size="16" x="272" y="141" fill="#223344">Isolation valve</text><text font-family="Arial" font-size="13" x="272" y="168" fill="#223344">Part pending</text><path stroke-width="2" d="M 460 150 L 485 150 l -6 -4 m 6 4 l -6 4" fill="none" stroke="#223344" /><rect stroke-dasharray="6 4" x="490" y="110" width="200" height="80" rx="8" fill="white" stroke="#5b7088" /><text font-family="Arial" font-size="16" x="502" y="141" fill="#223344">Pressure sensor + tee</text><text font-family="Arial" font-size="13" x="502" y="168" fill="#223344">O14b: geometry omitted</text><path stroke-width="2" d="M 690 150 L 715 150 l -6 -4 m 6 4 l -6 4" fill="none" stroke="#223344" /><rect stroke-dasharray="none" x="720" y="110" width="200" height="80" rx="8" fill="white" stroke="#5b7088" /><text font-family="Arial" font-size="16" x="732" y="141" fill="#223344">Reference chamber</text><text font-family="Arial" font-size="13" x="732" y="168" fill="#223344">SAR-0107 / SAR-0108</text><path stroke-width="2" d="M 920 150 L 945 150 l -6 -4 m 6 4 l -6 4" fill="none" stroke="#223344" /><rect stroke-dasharray="none" x="950" y="110" width="200" height="80" rx="8" fill="white" stroke="#5b7088" /><text font-family="Arial" font-size="16" x="962" y="141" fill="#223344">Muscle, fixed end</text><text font-family="Arial" font-size="13" x="962" y="168" fill="#223344">SAR-0002</text><text font-family="Arial" font-size="15" x="42" y="227" fill="#223344">Initial tube allowances: supply→valve 300 mm; valve→reference 200 mm (includes unresolved tee); reference→muscle 150 mm.</text><text font-family="Arial" font-size="15" x="42" y="257" fill="#223344">The ported muscle fitting is on the fixed end. Clamp the hose slack loop to the frame; keep its force out of the load cell.</text><text font-family="Arial" font-size="15" x="42" y="287" fill="#223344">The load cell is on the closed end. Relief sizing, seals, leak limit and P1–P7 remain qualification inputs.</text><text font-family="Arial" font-size="17" x="42" y="328" fill="#8b2839">No purchase, fabrication, testing or pressurization is authorized.</text></svg>